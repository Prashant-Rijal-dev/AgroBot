version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: agrobot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-agrobot}
      POSTGRES_USER:     ${POSTGRES_USER:-agrobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrobot_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: agrobot_web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrobot}:${POSTGRES_PASSWORD:-agrobot_secret}@db:5432/${POSTGRES_DB:-agrobot}
      SECRET_KEY:   ${SECRET_KEY:-change-this-in-production}
      SOIL_SHAPEFILE: /data/parentsoil/soilparent.shp
      MAIZE_TIF:      /data/Datasets/Maize.tif
      TOMATO_TIF:     /data/Datasets/Tomato.tif
    volumes:
      - ./parentsoil:/data/parentsoil:ro
      - ./Datasets:/data/Datasets:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: agrobot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website/static:/app/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
