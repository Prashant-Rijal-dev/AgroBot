{% extends "base.html" %}
{% block title %}Server Error — AgroBot{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center">
    <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem;"></i>
    <h1 class="display-4 fw-bold text-danger mt-3">500</h1>
    <h5 class="text-muted">Internal Server Error</h5>
    <p class="text-muted small">Something went wrong on our end. Please try again.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-success mt-2">
      <i class="bi bi-house me-2"></i>Back to Home
    </a>
  </div>
</div>
{% endblock %}
