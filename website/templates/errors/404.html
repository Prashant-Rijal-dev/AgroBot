{% extends "base.html" %}
{% block title %}Page Not Found — AgroBot{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center">
    <i class="bi bi-map text-muted" style="font-size:4rem;"></i>
    <h1 class="display-4 fw-bold text-success mt-3">404</h1>
    <h5 class="text-muted">Page Not Found</h5>
    <p class="text-muted small">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-success mt-2">
      <i class="bi bi-house me-2"></i>Back to Home
    </a>
  </div>
</div>
{% endblock %}
