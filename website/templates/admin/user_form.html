{% extends "base.html" %}
{% block title %}{{ action }} User — AgroBot{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:540px;">

  <div class="mb-4 d-flex align-items-center gap-3">
    <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i>
    </a>
    <div>
      <h4 class="fw-bold mb-0">
        <i class="bi bi-person-{% if action == 'Add' %}plus{% else %}gear{% endif %} text-success me-2"></i>
        {{ action }} User
      </h4>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" name="name" class="form-control"
                 value="{{ user.name if user else '' }}" required placeholder="e.g. Ram Sharma">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control"
                 value="{{ user.email if user else '' }}" required placeholder="user@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">
            Password {% if action == 'Edit' %}<span class="text-muted small fw-normal">(leave blank to keep current)</span>{% endif %}
          </label>
          <input type="password" name="password" class="form-control"
                 {% if action == 'Add' %}required{% endif %}
                 placeholder="{% if action == 'Add' %}Set a password{% else %}Leave blank to keep current{% endif %}"
                 minlength="6">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Role</label>
          <select name="role" class="form-select">
            <option value="farmer" {% if not user or user.role == 'farmer' %}selected{% endif %}>Farmer</option>
            <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success flex-grow-1">
            <i class="bi bi-check-lg me-2"></i>{{ action }} User
          </button>
          <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
