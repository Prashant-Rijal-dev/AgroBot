{% extends "base.html" %}
{% block title %}Register — AgroBot{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-7 col-lg-6 col-xl-5">
        <div class="card shadow border-0 auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="auth-logo mb-3">
                <i class="bi bi-leaf-fill text-success" style="font-size:2.5rem;"></i>
              </div>
              <h3 class="fw-bold">Create Account</h3>
              <p class="text-muted small">Join AgroBot and start farming smarter</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
              <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-person text-muted"></i>
                  </span>
                  <input type="text" name="name" class="form-control border-start-0 ps-0"
                         placeholder="Prashant Rijal" required autofocus>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-envelope text-muted"></i>
                  </span>
                  <input type="email" name="email" class="form-control border-start-0 ps-0"
                         placeholder="you@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                  </span>
                  <input type="password" name="password" class="form-control border-start-0 ps-0"
                         placeholder="Create a password" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock-fill text-muted"></i>
                  </span>
                  <input type="password" name="confirm_password" class="form-control border-start-0 ps-0"
                         placeholder="Repeat your password" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Account Type</label>
                <div class="d-flex gap-3">
                  <div class="role-card flex-fill text-center p-3 rounded border" onclick="selectRole('farmer')" id="role-farmer">
                    <i class="bi bi-person-arms-up text-success fs-4 d-block mb-1"></i>
                    <small class="fw-semibold">Farmer</small>
                  </div>
                  <div class="role-card flex-fill text-center p-3 rounded border" onclick="selectRole('admin')" id="role-admin">
                    <i class="bi bi-shield-check text-primary fs-4 d-block mb-1"></i>
                    <small class="fw-semibold">Admin</small>
                  </div>
                </div>
                <input type="hidden" name="role" id="roleInput" value="farmer">
              </div>

              <button type="submit" class="btn btn-success w-100 btn-lg fw-semibold">
                <i class="bi bi-person-plus me-2"></i>Create Account
              </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
              Already have an account?
              <a href="{{ url_for('auth.login') }}" class="text-success fw-semibold">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function selectRole(role) {
  document.getElementById('roleInput').value = role;
  document.getElementById('role-farmer').classList.toggle('role-selected', role === 'farmer');
  document.getElementById('role-admin').classList.toggle('role-selected', role === 'admin');
}
selectRole('farmer');
</script>
{% endblock %}
